<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research Library — Bilbo Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/bilbo-pup.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;--panel:#0c0d0f;--panel2:#090a0b;--line:#1b1c1f;--line2:#2a2c31;
    --ink:#f3f4f5;--dim:#8b909a;--mut:#585d66;
    --live:#4ad991;--accent:#5b8def;--warn:#e0a44a;--red:#e2645f;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:900px;margin:0 auto;padding:0 26px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--mut)}

  header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;gap:22px;height:64px;max-width:1400px}
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none}
  .brand img{height:36px;display:block}
  .brand .bn{font-size:21px;font-weight:500;letter-spacing:-.01em}
  .brand .dt{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;padding:5px 0 0 1px}
  nav.tabs{display:flex;gap:2px;margin-left:6px}
  nav.tabs a{font-size:13.5px;color:var(--dim);border:1px solid transparent;padding:7px 14px;border-radius:2px;cursor:pointer;text-decoration:none}
  nav.tabs a:hover{color:var(--ink)}
  nav.tabs a.on{color:var(--ink);border-color:var(--line2);background:#0e0f11}
  .mark{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:2px;padding:6px 11px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--live)}

  /* ---- doc head ---- */
  .dochead{padding:22px 0 22px;border-bottom:1px solid var(--line)}
  @media(min-width:1000px){
    .dochead .headgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px;align-items:start}
    .dochead .tiles{margin:0}
  }
  .crumb{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .back{display:grid;place-items:center;width:42px;height:42px;border:1px solid #3a1f22;background:#160d0e;color:var(--red);border-radius:3px;text-decoration:none;font-size:17px}
  .back:hover{border-color:var(--red)}
  .crumb .cid{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--live)}
  h1.doc{font-family:var(--mono);font-weight:500;font-size:clamp(24px,3.6vw,38px);letter-spacing:-.01em;line-height:1.22;margin:0}
  .metaline{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .dl{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#04070d;background:var(--live);border:1px solid var(--live);border-radius:2px;padding:10px 16px;text-decoration:none}
  .dl:hover{filter:brightness(1.12)}

  /* ---- stat tiles ---- */
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0 0}
  @media(max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:13px 15px 15px}
  .tile .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
  .tile .v{font-family:var(--mono);font-size:23px;font-weight:500;margin-top:6px;letter-spacing:-.01em}
  .tile.good .v{color:var(--live)}.tile.bad .v{color:var(--red)}.tile.warn .v{color:var(--warn)}
  .tile .s{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:6px}

  .callout{border:1px solid #3a1f22;background:#100b0c;border-radius:4px;padding:20px 22px;margin:22px 0 0}
  .callout .ct{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;color:var(--red);margin-bottom:10px}
  .callout p{margin:0;color:#dfe1e4}

  /* ---- rendered markdown ---- */
  .md{padding:30px 0 110px}
  .md h1{display:none}
  .md h2{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.01em;margin:52px 0 4px;padding-top:26px;border-top:1px solid var(--line)}
  .md h2 .num{color:var(--live);margin-right:10px}
  .md h3{font-size:17px;font-weight:400;color:#dfe1e4;margin:30px 0 6px}
  .md h4{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:24px 0 4px}
  .md p{margin:14px 0;color:#cfd2d6}
  .md strong{color:var(--ink);font-weight:500}
  .md em{color:var(--dim)}
  .md a{color:var(--accent);text-decoration:none;border-bottom:1px solid #1d2c4b;word-break:break-word}
  .md a:hover{border-bottom-color:var(--accent)}
  .md ul,.md ol{margin:14px 0;padding-left:20px;color:#cfd2d6}
  .md li{margin:6px 0}
  .md blockquote{margin:18px 0;padding:14px 18px;border-left:2px solid var(--live);background:#080b09;color:#dfe1e4;font-style:normal}
  .md blockquote p{margin:0}
  .md hr{border:0;border-top:1px solid var(--line);margin:34px 0}
  .md code{font-family:var(--mono);font-size:12.5px;background:#0e0f11;border:1px solid var(--line);border-radius:2px;padding:1px 5px}
  .tablewrap{overflow-x:auto;margin:20px 0;border:1px solid var(--line);border-radius:4px}
  .md table{border-collapse:collapse;width:100%;font-size:13.5px}
  .md thead th{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--live);background:#0a100d;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
  .md tbody td{padding:11px 14px;border-bottom:1px solid var(--line);color:#cfd2d6;vertical-align:top}
  .md tbody tr:last-child td{border-bottom:0}
  .md tbody tr:nth-child(even){background:#070809}
  .md td.num{font-family:var(--mono);color:var(--live)}
  .md td.none{font-family:var(--mono);color:var(--red)}

  /* ---- toc ---- */
  .doclayout{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:1120px){
    .wrap.doc{max-width:1260px}
    .doclayout{grid-template-columns:minmax(0,1fr) 230px;gap:44px}
    .toc{position:sticky;top:84px;align-self:start;padding:34px 0 0;max-height:calc(100vh - 110px);overflow:auto}
  }
  .toc{display:none}
  @media(min-width:1120px){.toc{display:block}}
  .toc h5{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .toc a{display:block;font-size:12.5px;color:var(--mut);text-decoration:none;padding:4px 0}
  .toc a:hover,.toc a.on{color:var(--live)}

  .loading{color:var(--mut);font-family:var(--mono);font-size:13px;padding:70px 0;text-align:center}
  @media(max-width:820px){.mark{display:none}}
</style>
<meta name="robots" content="index,follow">
<meta name="description" content="Bilbo Data research library — long-form research documents on vehicle recognition, surveillance infrastructure and the policy around it.">
<link rel="stylesheet" href="assets/mobile.css">
<link rel="stylesheet" href="assets/desktop.css">
<script src="assets/mobile.js" defer></script>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="index.html"><img src="assets/bilbo-pup.png" alt="Bilbo"><span class="bn">Bilbo</span><span class="dt">Data</span></a>
  <nav class="tabs">
    <a href="index.html">Modules</a>
    <a class="on" href="library.html#research">Library</a>
    <a href="skyline.html">SkyLine</a>
    <a href="index.html#about">About</a>
  </nav>
  <div class="mark"><span class="dot"></span>Research Library</div>
</div></header>

<div class="wrap doc" id="root"><div class="loading">loading document…</div></div>

<script>
/* ------------------------------------------------------------------ *
 * minimal markdown renderer — headings, tables, lists, quotes, rules
 * ------------------------------------------------------------------ */
function inline(s){
  return s
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
const NUM=/^[$<~]?[\d.,]+\s*(%|M|B|K|mph|ft|m|hr|hours?|days?|min|years?|units?)?$|^\$[\d.,]+[MBK]?(\s*\/.*)?$/i;
function cell(t){
  const c=inline(t);
  if(/^(none|not stated|not publicly specified|zero)$/i.test(t.trim()))return '<td class="none">'+c+'</td>';
  if(NUM.test(t.trim()))return '<td class="num">'+c+'</td>';
  return '<td>'+c+'</td>';
}
function render(md){
  const lines=md.replace(/^---\n[\s\S]*?\n---\n/,"").split("\n");
  let out=[],i=0,toc=[];
  const flush=(buf,tag)=>{ if(buf.length){out.push('<'+tag+'>'+buf.join("")+'</'+tag+'>');buf.length=0;} };
  let ul=[],ol=[],para=[];
  const flushPara=()=>{ if(para.length){out.push('<p>'+inline(para.join(" "))+'</p>');para=[];} };
  const flushLists=()=>{ flush(ul,"ul"); flush(ol,"ol"); };
  while(i<lines.length){
    const L=lines[i];
    if(/^\|/.test(L)&&/^\|[\s:|-]+\|$/.test(lines[i+1]||"")){
      flushPara();flushLists();
      const head=L.split("|").slice(1,-1).map(s=>s.trim());
      i+=2; const rows=[];
      while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i].split("|").slice(1,-1).map(s=>s.trim()));i++;}
      out.push('<div class="tablewrap"><table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join("")+
        '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(cell).join("")+'</tr>').join("")+'</tbody></table></div>');
      continue;
    }
    const h=L.match(/^(#{1,4})\s+(.*)$/);
    if(h){
      flushPara();flushLists();
      const lvl=h[1].length, txt=h[2];
      if(lvl===2){
        const m=txt.match(/^(\d+)\.\s*(.*)$/);
        /* the deck line under the title is already in the doc header — don't repeat it */
        if(!m&&!toc.length){i++;continue;}
        const id="s"+toc.length;
        toc.push({id,label:m?m[2]:txt});
        out.push('<h2 id="'+id+'">'+(m?'<span class="num">'+m[1]+'</span>'+inline(m[2]):inline(txt))+'</h2>');
      } else out.push('<h'+lvl+'>'+inline(txt)+'</h'+lvl+'>');
      i++;continue;
    }
    if(/^>\s?/.test(L)){
      flushPara();flushLists();
      const q=[];while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,""));i++;}
      out.push('<blockquote><p>'+inline(q.join(" ").trim())+'</p></blockquote>');continue;
    }
    if(/^(-{3,}|\*{3,})$/.test(L.trim())){flushPara();flushLists();out.push("<hr>");i++;continue;}
    let m;
    if((m=L.match(/^\s*[-*]\s+(.*)$/))){flushPara();flush(ol,"ol");ul.push('<li>'+inline(m[1])+'</li>');i++;continue;}
    if((m=L.match(/^\s*\d+\.\s+(.*)$/))){flushPara();flush(ul,"ul");ol.push('<li>'+inline(m[1])+'</li>');i++;continue;}
    if(!L.trim()){flushPara();flushLists();i++;continue;}
    para.push(L.trim());i++;
  }
  flushPara();flushLists();
  return {html:out.join("\n"),toc};
}

/* ------------------------------------------------------------------ */
const qs=new URLSearchParams(location.search);
const want=qs.get("doc")||"DOC-001";

fetch("research/index.json").then(r=>r.json()).then(ix=>{
  const d=ix.docs.find(x=>x.id===want)||ix.docs[0];
  return fetch(d.file).then(r=>r.text()).then(md=>({d,md}));
}).then(({d,md})=>{
  const {html,toc}=render(md);
  document.title=d.title.split("—")[0].trim()+" — Bilbo Research";
  document.getElementById("root").innerHTML=
    '<div class="dochead">'+
      '<div class="headgrid">'+
        '<div>'+
          '<div class="crumb"><a class="back" href="library.html#research">←</a>'+
            '<span class="cid">// '+d.id+' · '+d.category+'</span></div>'+
          '<h1 class="doc">'+d.title+'</h1>'+
          '<div class="metaline"><span>'+d.date+'</span><span>·</span><span>'+d.read+' min read</span>'+
            '<a class="dl" href="'+d.file+'" download>↓ Raw Markdown</a></div>'+
        '</div>'+
        '<div class="tiles">'+d.stats.map(s=>
          '<div class="tile '+(s.tone||"")+'"><div class="k">'+s.k+'</div><div class="v">'+s.v+'</div><div class="s">'+(s.sub||"")+'</div></div>').join("")+
        '</div>'+
      '</div>'+
      (d.headline?'<div class="callout"><div class="ct">'+d.headline.title+'</div><p>'+d.headline.body+'</p></div>':'')+
    '</div>'+
    '<div class="doclayout"><article class="md">'+html+'</article>'+
      '<nav class="toc"><h5>Contents</h5>'+toc.map(t=>'<a href="#'+t.id+'">'+t.label+'</a>').join("")+'</nav></div>';

  const links=[...document.querySelectorAll(".toc a")];
  const heads=[...document.querySelectorAll(".md h2")];
  addEventListener("scroll",()=>{
    let cur=0;heads.forEach((h,n)=>{if(h.getBoundingClientRect().top<140)cur=n;});
    links.forEach((a,n)=>a.classList.toggle("on",n===cur));
  },{passive:true});
}).catch(e=>{
  document.getElementById("root").innerHTML='<div class="loading">could not load document — '+e+'</div>';
});
</script>
</body>
</html>
