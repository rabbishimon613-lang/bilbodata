name: count
# The always-on worker: runs on a schedule, counts one pass, commits the data.
# Free on public repos. git is the database; Cloudflare Pages redeploys on push.

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 min (GitHub's minimum granularity)
  workflow_dispatch: {}        # lets you trigger a run by hand

permissions:
  contents: write              # built-in GITHUB_TOKEN — no PAT needed

concurrency:
  group: count
  cancel-in-progress: true     # a fresh scheduled launch supersedes the tail of the old one

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: sample continuously, commit every minute
        run: |
          git config user.name  "pedcount-bot"
          git config user.email "actions@users.noreply.github.com"
          END=$(( $(date +%s) + 240 ))     # ~4 min of work, safely inside the 5-min cron
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            python counter.py --minute       # ~50s of dense sampling -> one averaged row/cam
            i=$((i+1))
            git add counts.csv stats.json counts.json
            [ $((i % 4)) -eq 0 ] && git add preview   # frames every 4th min -> curb history bloat
            git commit -m "tick $(date -u +%FT%TZ)" || { echo "nothing to commit"; continue; }
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || true
          done
