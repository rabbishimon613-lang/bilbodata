name: count
# LEGACY short-pass worker, now MANUAL-ONLY. The continuous 24/7 worker is
# worker.yml (self-perpetuating). This is kept as a hand-triggered backup for a
# single ~4-minute pass; its schedule is disabled so the two never fight over
# the same files.

on:
  workflow_dispatch: {}        # manual backup only — worker.yml is the live one

permissions:
  contents: write              # built-in GITHUB_TOKEN — no PAT needed

concurrency:
  group: count
  cancel-in-progress: true     # a fresh scheduled launch supersedes the tail of the old one

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: sample continuously, commit every minute
        env:
          # Optional live mirror to Turso; no-op when the secrets are unset.
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          git config user.name  "pedcount-bot"
          git config user.email "actions@users.noreply.github.com"
          # roll any FINISHED days out of the hot logs into forever Parquet archives
          python storage.py compact || true
          git add counts.csv vehicles.csv trips.csv data data_vehicles data_trips 2>/dev/null || true
          git commit -m "compact archives $(date -u +%F)" && { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true; git push || true; } || true
          END=$(( $(date +%s) + 240 ))     # ~4 min of work, safely inside the 5-min cron
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            python counter.py --minute       # ~50s of dense sampling -> one averaged row/cam + per-vehicle log
            python pipeline.py || true        # roll up metric/fleet/speed analytics on the fresh data
            i=$((i+1))
            git add counts.csv stats.json counts.json vehicles.csv calibration.json fleet.json speed.json trajectories.json
            git add trips.csv data_trips 2>/dev/null || true   # may not exist until a trip completes
            [ $((i % 4)) -eq 0 ] && git add preview   # frames every 4th min -> curb history bloat
            git commit -m "tick $(date -u +%FT%TZ)" || { echo "nothing to commit"; continue; }
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || true
          done
