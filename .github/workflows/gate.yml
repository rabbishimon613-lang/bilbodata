name: train-gate

# CONTINUOUS TRAINING GATE — with 5 Kaggle accounts rotating, this ticks
# every 30 min. Each tick picks the account with the oldest last_used
# stamp, checks per-account bank (crops-since-that-account's-last-burst)
# and fires a new burst if the bank cleared the threshold. Any completed
# kernel from a prior tick is collected first (weights -> `models` Release,
# reports -> training/heads_status.json). Effect: 5 accounts × ~48 ticks/day
# = each account cycles ~10 times/day; Kaggle's own quota is the ceiling
# that actually rate-limits us. Multi-accounting VIOLATES Kaggle's ToS —
# rotation reduces the byte-identical signal but doesn't remove the risk.
#
# Auth (Kaggle's single-token scheme):
#   - repo SECRET KAGGLE_API_TOKEN
#       * a single "KGAT_..." value            -> single-account mode, OR
#       * several KGAT_... comma-separated     -> multi-account rotation
#   No repo variable needed — the account's public username is derived per
#   token from `kaggle kernels init`.
# Without the secret, the workflow explains itself and exits 0.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: train-gate
  cancel-in-progress: false

permissions:
  contents: write

env:
  NEW_CROPS_THRESHOLD: "500"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kaggle CLI
        run: pip install --quiet kaggle

      - name: Pick this tick's Kaggle account (rotation)
        id: rot
        env:
          # After this step the picked token lives at ~/.kaggle/access_token —
          # LATER steps deliberately do NOT export KAGGLE_API_TOKEN so the CLI
          # authenticates via that file, not the multi-token bundle.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python fp/rotate_token.py

      - name: Collect any finished kernel output
        if: steps.rot.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KUSER: ${{ steps.rot.outputs.kuser }}
          KSLUG: ${{ steps.rot.outputs.kslug }}
        run: |
          KREF="$KUSER/$KSLUG"
          STATUS=$(kaggle kernels status "$KREF" 2>/dev/null | tr -d '"' || echo none)
          echo "kernel status ($KREF): $STATUS"
          case "$STATUS" in *complete*) ;; *) exit 0;; esac
          mkdir -p kout && kaggle kernels output "$KREF" -p kout || exit 0
          ls -la kout
          if ls kout/*_report.json >/dev/null 2>&1; then
            mkdir -p fp_models && cp kout/*_report.json fp_models/
            python fp/publish_heads.py --models fp_models --dest training/heads_status.json
            git config user.name "bilbo-gate"
            git config user.email "actions@users.noreply.github.com"
            git add training/heads_status.json
            git diff --cached --quiet || {
              git commit -m "train-gate: head reports -> heads_status.json ($KUSER)"
              for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 20; done
            }
          fi
          if ls kout/*.pt >/dev/null 2>&1; then
            gh release view models >/dev/null 2>&1 || \
              gh release create models --title "head weights" --notes "trained head checkpoints from Kaggle bursts"
            STAMP=$(date -u +%Y%m%dT%H%M%S)
            for w in kout/*.pt; do
              cp "$w" "${w%.pt}_${STAMP}.pt"
              gh release upload models "${w%.pt}_${STAMP}.pt" || true
            done
          fi

      - name: Count crops banked since THIS account's last burst
        id: bank
        if: steps.rot.outputs.armed == 'true'
        env:
          LAST_COUNT: ${{ steps.rot.outputs.last_count }}
        run: |
          # Cumulative across rotations. fp/crops_meta.cloud.jsonl is now rolled
          # into the crops release whenever it nears GitHub's 100MiB file cliff,
          # so its raw line count collapses at each rotation — a bare `wc -l`
          # would read that as the corpus shrinking and stop firing bursts
          # forever. rotate_meta.py --total is monotonic across rotations, and
          # equals the old line count exactly for every pre-rotation stamp, so
          # the per-account last_count values stay valid across this change.
          TOTAL=$(python fp/rotate_meta.py --total crops 2>/dev/null \
                  || wc -l < fp/crops_meta.cloud.jsonl 2>/dev/null || echo 0)
          LAST=${LAST_COUNT:-0}
          NEW=$((TOTAL - LAST))
          echo "total=$TOTAL account_last=$LAST new=$NEW threshold=$NEW_CROPS_THRESHOLD"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          if [ "$NEW" -ge "$NEW_CROPS_THRESHOLD" ]; then
            echo "fire=true" >> "$GITHUB_OUTPUT"
          else
            echo "fire=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fire a Kaggle burst
        if: steps.rot.outputs.armed == 'true' && steps.bank.outputs.fire == 'true'
        env:
          KUSER: ${{ steps.rot.outputs.kuser }}
          KSLUG: ${{ steps.rot.outputs.kslug }}
          KIDX: ${{ steps.rot.outputs.kidx }}
          TOTAL: ${{ steps.bank.outputs.total }}
        run: |
          # rewrite the kernel-metadata to this tick's account + slug
          python - <<PY
          import json, os
          m = json.load(open("kaggle/kernel-metadata.json"))
          m["id"] = f"{os.environ['KUSER']}/{os.environ['KSLUG']}"
          m["title"] = os.environ['KSLUG']
          json.dump(m, open("kaggle/kernel-metadata.json", "w"), indent=1)
          PY
          kaggle kernels push -p kaggle/
          # stamp this account's own last_count + last_burst_ts
          python - <<PY
          import json, os, time
          state = json.load(open("kaggle/rotation.json"))
          idx = int(os.environ["KIDX"])
          total = int(os.environ["TOTAL"])
          for a in state["accounts"]:
              if a["idx"] == idx:
                  a["last_count"] = total
                  a["last_burst_ts"] = int(time.time())
          json.dump(state, open("kaggle/rotation.json","w"), indent=1)
          PY
          git config user.name "bilbo-gate"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- kaggle/kernel-metadata.json
          git add kaggle/rotation.json
          git commit -m "train-gate: burst fired via $KUSER at $TOTAL crops"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 20; done

      - name: Persist rotation state (even if no burst fired)
        if: steps.rot.outputs.armed == 'true' && steps.bank.outputs.fire != 'true'
        run: |
          git config user.name "bilbo-gate"
          git config user.email "actions@users.noreply.github.com"
          git add kaggle/rotation.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "train-gate: rotation tick — ${{ steps.rot.outputs.kuser }}"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 20; done
          fi
