name: deploy-shell

# Deploys the site shell to Vercel production whenever shell files change.
# Data-tick commits (counts.csv, *.json, preview/) do NOT match these paths,
# so the ~288 daily worker commits never trigger a deploy. The live page reads
# its data straight from raw.githubusercontent, not from Vercel, so the shell
# only needs redeploying when the HTML/config actually changes.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'vercel.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Deploy latest shell to production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
