name: deploy-shell

# MANUAL ONLY — never auto-deploys. Vercel's free plan caps deploys at 100/day
# ACCOUNT-WIDE (shared across every shimonindustries project), so nothing here
# fires on a push. The live page reads its data straight from raw.githubusercontent,
# not from Vercel, so the shell almost never needs redeploying. When the HTML/config
# genuinely changes, publish it deliberately:
#     gh workflow run deploy-shell         (or the Actions tab -> Run workflow)
# This is the ONLY path that deploys Bilbo. Data ticks, the local runner, and code
# pushes never touch Vercel.

on:
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Deploy latest shell to production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
