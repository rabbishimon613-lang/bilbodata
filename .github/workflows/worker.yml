name: worker

# ALWAYS-ON, FREE, NO CARD — GitHub Actions as a self-perpetuating worker.
#
# Public repos get unlimited Actions minutes and a job can run ~6h. So each
# generation of this workflow samples the cameras CONTINUOUSLY for ~5.5h (no
# hourly blind gaps), then its last step DISPATCHES THE NEXT GENERATION via a
# stored token (the default GITHUB_TOKEN is blocked from doing that on purpose).
# The chain never stops -> a 24/7 worker for $0.
#
# The sample loop is bounded to run_seconds (< the job timeout) so it exits
# cleanly and the relay step always gets to fire the next generation.
#
# Scale-up (later): add a `shard` matrix + point PEDCOUNT_CAMS at cams_all.json;
# GitHub runs up to 20 jobs at once = ~20 parallel workers for all 900 cameras.

on:
  workflow_dispatch:
    inputs:
      generation:
        description: chain counter (auto-increments)
        default: "0"
      run_seconds:
        description: how long this generation samples before handing off (~5.5h default; set small to test the chain)
        default: "20000"

permissions:
  contents: write

concurrency:
  group: worker
  cancel-in-progress: false      # let a generation finish; the next one queues behind it

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # < 6h hard cap; the loop stops before this
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: continuous sample + tag + analyze
        env:
          # Optional live mirror to Turso. Absent secrets -> counter no-ops the
          # DB writes and files-in-repo stay the sole source of truth.
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          git config user.name  "bilbo-worker"
          git config user.email "actions@users.noreply.github.com"
          python storage.py compact || echo "::warning::compact failed — hot logs not archived"
          END=$(( $(date +%s) + ${{ inputs.run_seconds }} ))
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            python counter.py --minute                 # ~50s: detect, track, tag one minute (vehicles only)
            python pipeline.py || true                 # merge + per-camera type/size aggregation
            i=$((i+1))
            # hard guard: GitHub rejects any file >100MB, which silently kills every
            # push and freezes the site. If a hot log nears the cliff, force-archive
            # it (today included) before committing.
            for f in vehicles.csv counts.csv; do
              if [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 80000000 ]; then
                echo "::warning::$f >80MB — emergency compact --all"
                python storage.py compact --all || true
              fi
            done
            # commit data every ~5 minutes to curb git-history bloat; frames on the 30s
            git add counts.csv vehicles.csv counts.csv.legacy vehicles.csv.legacy \
                    counts.json stats.json calibration.json fleet.json \
                    data data_vehicles 2>/dev/null || true
            case "$(date +%M)" in 00|30) git add preview 2>/dev/null || true ;; esac
            if [ $((i % 5)) -eq 0 ]; then
              git commit -m "pulse $(date -u +%FT%TZ)" || true
              git pull --rebase --autostash origin main || true
              git push || true
            fi
          done
          # flush whatever is staged before handing off
          git commit -m "pulse $(date -u +%FT%TZ)" || true
          git pull --rebase --autostash origin main || true
          git push || true

      - name: relay -> launch next generation (the chain)
        if: ${{ !cancelled() }}   # error still chains; a manual CANCEL stops the chain cleanly
        env:
          GH_TOKEN: ${{ secrets.WORKER_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "no WORKER_PAT secret -> chain stops here. Set it to run 24/7."
            exit 0
          fi
          NEXT=$(( ${{ inputs.generation }} + 1 ))
          gh workflow run worker.yml \
            -f generation="$NEXT" \
            -f run_seconds="${{ inputs.run_seconds }}" \
            && echo "launched generation $NEXT" || echo "relay dispatch failed"
